            <div class="confirm-message">${escapeHtml(message).replaceAll("\n", "<br>")}</div>
          </div>
          <div class="actions">
            <button class="${danger ? "danger-button" : "primary-button"}" type="button" id="confirmOkButton">${escapeHtml(confirmText)}</button>
            <button class="secondary-button" type="button" id="confirmCancelButton">${escapeHtml(cancelText)}</button>
          </div>
        `);

        // Esc・背景タップで閉じた場合はキャンセル扱い
        state.modalOnClose = () => resolve(false);
        document.getElementById("confirmOkButton").addEventListener("click", () => {
          resolve(true);
          closeModal({ restoreFocus: false });
        });
        document.getElementById("confirmCancelButton").addEventListener("click", () => {
          resolve(false);
          closeModal();
        });
      });
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("open");
      state.toastTimer = setTimeout(() => elements.toast.classList.remove("open"), 2600);
    }

    function setupEnterNavigation(inputIds) {
      const inputs = inputIds
        .map(id => document.getElementById(id))
        .filter(Boolean);

      inputs.forEach((input, index) => {
        input.addEventListener("keydown", event => {
          // IME変換確定の Enter は次の欄へ進めない
          if (event.key !== "Enter" || isImeComposing(event)) return;

          event.preventDefault();
          const nextInput = inputs[index + 1];

          if (nextInput) {
            nextInput.focus({ preventScroll: true });
            if (typeof nextInput.select === "function") nextInput.select();
            return;
          }

          input.blur();
        });
      });
    }

    function setupSelectAllOnFocus(inputIds) {
      inputIds
        .map(id => document.getElementById(id))
        .filter(Boolean)
        .forEach(input => {
          input.addEventListener("focus", () => {
            if (typeof input.select === "function") input.select();
          });
        });
    }

    function setupMoneyInput(inputId, allowNegative = false) {
      const input = document.getElementById(inputId);
      if (!input) return;

      input.addEventListener("focus", () => {
        const parsed = parseYenInput(input.value, allowNegative);
        input.value = parsed === null ? "" : String(parsed);
        input.select();
      });

      input.addEventListener("blur", () => {
        const parsed = parseYenInput(input.value, allowNegative);
        input.value = parsed === null ? "" : formatYenInput(parsed, allowNegative);
      });
    }

    function parseYenInput(value, allowNegative = false) {
      // 日本語IMEでの全角数字・全角マイナスを半角に正規化する
      const text = String(value ?? "").replace(/[０-９－]/g, char => String.fromCharCode(char.charCodeAt(0) - 0xfee0));
      const digits = text.replace(/[^0-9]/g, "");
      if (!digits) return null;
      const number = Number(digits);
      if (!Number.isFinite(number)) return null;
      const negative = allowNegative && /^\s*[-−ー]/.test(text);
      return Math.trunc(negative ? -number : number);
    }

    function formatYenInput(value, allowNegative = false) {
      const parsed = parseYenInput(value, allowNegative);
      if (parsed === null) return "";
      return `${parsed < 0 ? "-" : ""}¥ ${INTEGER_FORMATTER.format(Math.abs(parsed))}`;
    }

    function readPositiveAmount(inputId) {
      const value = parseYenInput(document.getElementById(inputId).value);
      if (value === null || value <= 0) {
        showToast("金額を入力してください。");
        return null;
      }
      return value;
    }

    function formatYen(value) {
      return YEN_FORMATTER.format(value);
    }

    function formatSignedYen(value) {
      const sign = value > 0 ? "+" : value < 0 ? "-" : "";
      return `${sign}${formatYen(Math.abs(value))}`;
    }

    function formatMonthDay(dateText) {
      const [, month, day] = dateText.split("-").map(Number);
      return `${month}/${day}`;
    }

    function todayAsInputValue() {
      return toDateInputValue(new Date());
    }

    function toDateInputValue(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function uniqueStrings(values) {
      return [...new Set(values.map(value => String(value || "").trim()).filter(Boolean))];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => HTML_ESCAPES[char]);
    }

    function preventSiteZoom() {
      ["gesturestart", "gesturechange", "gestureend"].forEach(type => {
        document.addEventListener(type, event => event.preventDefault(), { passive: false });
      });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", event => {
        // 一括編集の行選択は連続タップを妨げない（拡大は touch-action で防ぐ）
        if (state.bulkEdit && event.target.closest(`${TAPPABLE_ROW}, #selectAllButton`)) return;
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    }

    preventSiteZoom();
  </script>
</body>
</html>
