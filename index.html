<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>収支管理簿</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    :root {
      color-scheme: light;
      --bg-main: #f1efe6;
      --panel: rgba(255, 255, 255, .58);
      --text: #101d2f;
      --muted: #5c6b84;
      --income: #128a5c;
      --expense: #c33f2e;
      --accent: #163659;
      --accent-dark: #0a1f36;
      --gold-dark: #8a6a2f;
      --gold-pale: rgba(198, 161, 91, .16);
      --hairline: rgba(16, 29, 47, .09);
      --hairline-strong: rgba(16, 29, 47, .16);
      --glass-blur: blur(26px) saturate(180%);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, .75);
      --accent-gradient: linear-gradient(155deg, var(--accent), var(--accent-dark));
      --ease-out: cubic-bezier(.22, .80, .28, 1);
      --ease-in: cubic-bezier(.4, 0, 1, 1);
      --motion-duration: .32s;
      --motion-duration-short: .24s;
      --focus-ring: rgba(22, 54, 89, .22);
      --radius: 14px;
      --radius-sm: 10px;
      --actions-gap: 10px;
      --inner-width: min(720px, calc(100vw - 36px));
      --header-h: 164px;
      --footer-h: 132px;
      --header-top-gap: 22px;
      --content-gap: 12px;
      --footer-bottom-gap: 12px;
      --floating-gap: 12px;
      --list-row-font-size: 15px;
      --list-row-line-height: 1.25;
      --list-row-height: 44px;
      --list-row-left: 12px;
      --list-row-right: 10px;
      --data-btn-pad-x: 14px;
      --tx-row-left: calc(var(--list-row-left) - 2px);
      --date-pad-r: 6px;
      /* 数字4桁＋スラッシュ＋右余白が必ず収まる幅（全行共通） */
      --date-col-w: calc(5ch + var(--date-pad-r));
      --excluded-text: rgba(16, 29, 47, .27);
      --row-pressed: rgba(16, 29, 47, .06);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, "Segoe UI", sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(120% 70% at 10% -10%, rgba(22, 54, 89, .16), transparent 60%),
        radial-gradient(110% 80% at 108% 4%, rgba(198, 161, 91, .18), transparent 56%),
        radial-gradient(130% 90% at 42% 116%, rgba(18, 138, 92, .08), transparent 62%),
        linear-gradient(175deg, var(--bg-main) 0%, #eef1ee 55%, #f2efe2 100%);
      padding-top: calc(var(--header-h) + var(--content-gap));
      height: 100dvh;
      overflow: hidden;
      transition: background .28s ease;
    }

    body.fixed-screen {
      background:
        radial-gradient(120% 70% at 10% -10%, rgba(22, 54, 89, .16), transparent 60%),
        radial-gradient(110% 80% at 108% 4%, rgba(198, 161, 91, .14), transparent 56%),
        radial-gradient(130% 90% at 42% 116%, rgba(22, 54, 89, .07), transparent 62%),
        linear-gradient(175deg, var(--bg-main) 0%, #eef1ee 55%, #f2efe2 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s var(--ease-out);
    }

    button:active {
      transform: scale(.96);
    }

    .top-balance {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, .5);
      background: rgba(255, 255, 255, .55);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: 0 1px 0 rgba(16, 29, 47, .05);
      padding: calc(var(--header-top-gap) + env(safe-area-inset-top)) 0 16px;
    }

    .top-inner,
    .bottom-inner,
    .main {
      width: var(--inner-width);
      margin: 0 auto;
    }

    .header-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .screen-title {
      margin: 0;
      color: var(--accent-dark);
      font-size: clamp(26px, 5.6vw, 32px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .data-button {
      flex: 0 0 auto;
      border: 1px solid var(--hairline-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      color: var(--accent-dark);
      box-shadow: var(--glass-highlight);
      padding: 9px var(--data-btn-pad-x);
      font-size: 13px;
      line-height: 1.1;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .header-actions {
      position: relative;
      display: flex;
      flex: 0 0 auto;
    }

    /* バックアップボタンの領域内に重ね、ヘッダーの寸法を変えない */
    .bulk-select {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      display: none;
      align-items: center;
      gap: 8px;
    }

    body.bulk-edit .bulk-select {
      display: flex;
    }

    body.bulk-edit #dataButton {
      visibility: hidden;
    }

    .bulk-select .data-button {
      min-width: calc(5em + var(--data-btn-pad-x) * 2 + 2px);
      color: #fff;
      background: var(--accent-gradient);
      border-color: rgba(255, 255, 255, .30);
      box-shadow: none;
      font-weight: 700;
      touch-action: manipulation;
    }

    .bulk-count {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* レイアウトに影響させないよう絶対配置。右端はボタンの文字端に揃える */
    .app-version {
      position: absolute;
      top: calc(100% + 5px);
      right: calc(var(--data-btn-pad-x) + 1px);
      color: var(--muted);
      opacity: .55;
      font-size: 10px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }

    .balance-area {
      margin-top: 12px;
    }

    body.fixed-screen .balance-area {
      display: none;
    }

    .label {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .editable-balance {
      width: 100%;
      min-height: 72px;
      border: none;
      border-radius: 14px;
      background:
        radial-gradient(130% 170% at 104% -14%, rgba(198, 161, 91, .40), transparent 55%),
        linear-gradient(160deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 42%),
        linear-gradient(155deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fbf8f1;
      box-shadow:
        0 20px 38px -22px rgba(10, 22, 39, .50),
        inset 0 1px 0 rgba(255, 255, 255, .22);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      font-size: clamp(30px, 7.6vw, 42px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
    }

    .editable-balance::after {
      content: "タップして編集";
      flex: 0 0 auto;
      color: rgba(251, 248, 241, .5);
      font-size: 12.5px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .editable-balance:disabled {
      cursor: default;
    }

    .editable-balance:disabled::after {
      visibility: hidden;
    }

    .main {
      overflow: hidden;
      height: max(120px, calc(100dvh - var(--header-h) - var(--content-gap) - var(--footer-h) - 86px));
    }

    .screen-slider {
      display: flex;
      width: 200%;
      height: 100%;
      transform: translateX(0);
      transition: transform var(--motion-duration) var(--ease-out);
      will-change: transform;
    }

    body.fixed-screen .screen-slider {
      transform: translateX(-50%);
    }

    .screen {
      flex: 0 0 50%;
      min-width: 0;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 0 2px;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen.screen-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .list,
    .fixed-cost-group,
    .empty,
    .bottom-summary,
    .fixed-bottom-summary {
      border: 1px solid var(--hairline);
      background: var(--panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-highlight);
    }

    .list,
    .fixed-cost-group,
    .empty {
      border-radius: var(--radius);
      overflow: hidden;
    }

    .row,
    .fixed-cost-item {
      border-bottom: 1px solid var(--hairline);
    }

    .row:last-child,
    .fixed-cost-item:last-child {
      border-bottom: 0;
    }

    .transaction-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      min-height: var(--list-row-height);
      padding: 0 var(--list-row-right) 0 0;
    }

    /* 行タップで編集（一括編集中は選択） */
    .transaction-row,
    .fixed-cost-item,
    .fixed-cost-group-head {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    /* 背景色を上書きせず重ねるため内側の影で押下を表す */
    .transaction-row:active,
    .fixed-cost-item:active,
    .fixed-cost-group-head:active {
      box-shadow: inset 0 0 0 999px var(--row-pressed);
    }

    .transaction-row:focus-visible,
    .fixed-cost-item:focus-visible,
    .fixed-cost-group-head:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: -2px;
    }

    .list-hint {
      margin: 8px 2px 0;
      color: var(--muted);
      opacity: .55;
      font-size: 11.5px;
      font-weight: 500;
      text-align: right;
    }

    body.bulk-edit .list-hint {
      display: none;
    }

    .transaction-info {
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-columns: var(--date-col-w) minmax(0, 1fr) auto;
      gap: 3px;
      align-items: center;
      min-height: var(--list-row-height);
      padding-left: var(--tx-row-left);
      font-size: var(--list-row-font-size);
      font-weight: 600;
    }

    .transaction-info::after {
      content: "";
      position: absolute;
      left: calc(var(--tx-row-left) + var(--date-col-w) + 1.5px);
      top: 11px;
      bottom: 11px;
      width: 1px;
      background: var(--hairline-strong);
      pointer-events: none;
    }

    .date {
      color: var(--muted);
      font-size: var(--list-row-font-size);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: var(--list-row-line-height);
      white-space: nowrap;
      text-align: right;
      padding-right: var(--date-pad-r);
    }

    .name {
      min-width: 0;
      color: var(--text);
      font-size: var(--list-row-font-size);
      font-weight: 600;
      line-height: var(--list-row-line-height);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 6px;
    }

    .amount,
    .fixed-cost-amount {
      font-size: var(--list-row-font-size);
      font-weight: 700;
      line-height: var(--list-row-line-height);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .amount.income,
    .money-positive { color: var(--income) !important; }
    .amount.expense,
    .money-negative { color: var(--expense) !important; }
    .money-zero { color: var(--text) !important; }

    .transaction-row.excluded .date,
    .transaction-row.excluded .name,
    .transaction-row.excluded .amount {
      color: var(--excluded-text) !important;
    }

    /* 上下の負マージンで行の高さに影響させない（縦中央揃えは保つ） */
    .bulk-check {
      display: none;
      position: relative;
      width: 22px;
      height: 22px;
      margin-block: -11px;
      padding: 0;
      border: 1.5px solid rgba(16, 29, 47, .28);
      border-radius: 50%;
      background: rgba(255, 255, 255, .7);
      cursor: pointer;
    }

    .bulk-check::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 2.5px;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      opacity: 0;
    }

    .selected .bulk-check {
      background: var(--accent);
      border-color: var(--accent);
    }

    .selected .bulk-check::after {
      opacity: 1;
    }

    body.bulk-edit .bulk-check {
      display: block;
    }

    body.bulk-edit .transaction-row {
      grid-template-columns: auto minmax(0, 1fr);
      column-gap: 0;
      padding-left: var(--tx-row-left);
    }

    body.bulk-edit .fixed-cost-group-head,
    body.bulk-edit .fixed-cost-item {
      grid-template-columns: auto minmax(0, 1fr) auto;
      column-gap: var(--list-row-left);
    }

    .fixed-cost-list {
      display: grid;
      gap: 10px;
    }

    .fixed-cost-group-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 11px var(--list-row-right) 10px var(--list-row-left);
      background: var(--gold-pale);
      border-bottom: 1px solid rgba(16, 29, 47, .10);
    }

    .fixed-cost-head-title {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 7px;
      color: var(--accent-dark);
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -.01em;
      overflow: hidden;
      white-space: nowrap;
    }

    .fixed-cost-head-title span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fixed-cost-head-title small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .fixed-cost-subtotal {
      min-width: 82px;
      text-align: right;
      color: var(--accent-dark);
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .fixed-cost-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      height: var(--list-row-height);
      padding: 0 var(--list-row-right) 0 var(--list-row-left);
    }

    .fixed-cost-name {
      min-width: 0;
      color: var(--text);
      font-size: var(--list-row-font-size);
      font-weight: 600;
      line-height: var(--list-row-line-height);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fixed-cost-amount {
      min-width: 82px;
      text-align: right;
    }

    .empty,
    .empty-mini {
      color: var(--muted);
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }

    .empty {
      padding: 38px 18px;
    }

    .empty-mini {
      border: 1px solid var(--hairline);
      border-radius: 11px;
      background: var(--panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-highlight);
      padding: 18px 12px;
    }

    /* カテゴリ内の空表示は明細行と同じ見た目にする */
    .fixed-cost-group .empty-mini {
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--list-row-height);
      padding: 0 var(--list-row-right) 0 var(--list-row-left);
      border: 0;
      border-radius: 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      font-size: var(--list-row-font-size);
      line-height: var(--list-row-line-height);
    }

    .floating-actions {
      position: fixed;
      left: max(18px, calc((100vw - 720px) / 2 + 18px));
      right: max(18px, calc((100vw - 720px) / 2 + 18px));
      bottom: calc(var(--footer-h) + 22px);
      z-index: 18;
      display: flex;
      align-items: center;
      gap: var(--floating-gap);
      pointer-events: none;
    }

    .floating-spacer {
      flex: 1 1 auto;
      min-width: 8px;
    }

    .floating-nav,
    .floating-clear,
    .floating-add {
      min-width: 0;
      min-height: 52px;
      border-radius: 999px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, .5);
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 16px 30px -18px rgba(10, 22, 39, .40);
      pointer-events: auto;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .floating-nav {
      flex: 0 1 auto;
      color: var(--accent-dark);
      background: rgba(255, 255, 255, .66);
      border-color: rgba(255, 255, 255, .6);
    }

    .floating-clear {
      flex: 0 0 auto;
      color: var(--expense);
      background: rgba(255, 255, 255, .58);
      border-color: rgba(195, 63, 46, .22);
    }

    .floating-add {
      flex: 0 0 auto;
      color: #fff;
      background: var(--accent-gradient);
      border-color: rgba(255, 255, 255, .30);
    }

    .floating-actions .bulk-done {
      flex: 0 1 auto;
      width: 7em;
      min-width: 0;
    }

    .floating-actions .bulk-action {
      flex: 0 0 auto;
      width: 5em;
      padding: 0;
    }

    .floating-nav:disabled,
    .floating-clear:disabled {
      opacity: .4;
      cursor: default;
    }

    button:disabled:active {
      transform: none;
    }

    .bottom-summary,
    .fixed-bottom-summary {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      border-width: 1px 0 0;
      border-radius: 0;
      background: rgba(255, 255, 255, .70);
      padding: 10px 0 calc(var(--footer-bottom-gap) + env(safe-area-inset-bottom));
    }

    body.fixed-screen .bottom-summary,
    body:not(.fixed-screen) .fixed-bottom-summary {
      display: none;
    }

    .summary-grid {
      display: grid;
      gap: 4px;
    }

    .summary-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      line-height: 1.12;
    }

    .summary-line span:first-child {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .summary-line span:last-child {
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    .summary-line.total {
      border-top: 1px solid var(--hairline);
      margin-top: 3px;
      padding-top: 7px;
    }

    .summary-line.total span:last-child {
      font-size: clamp(25px, 6.2vw, 30px);
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .fixed-bottom-summary .summary-line.total {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    .fixed-bottom-summary .summary-line.total span:first-child {
      font-size: 14px;
    }

    .fixed-bottom-summary .summary-line.total span:last-child {
      color: var(--accent-dark);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(9, 17, 29, .44);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      position: relative;
      width: min(560px, 100%);
      max-height: min(86vh, 720px);
      overflow: auto;
      border-radius: 16px;
      padding: 16px 20px 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .46), rgba(248, 246, 239, .18) 30%),
        rgba(249, 247, 241, .58);
      border: 1px solid rgba(255, 255, 255, .55);
      backdrop-filter: blur(44px) saturate(200%);
      -webkit-backdrop-filter: blur(44px) saturate(200%);
      box-shadow:
        0 32px 70px -24px rgba(10, 22, 39, .50),
        inset 0 1px 0 rgba(255, 255, 255, .85);
    }

    .modal::before {
      content: "";
      display: block;
      width: 38px;
      height: 5px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: rgba(16, 29, 47, .18);
    }

    .modal-head {
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0;
      color: var(--text);
      font-size: 21px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .field {
      display: grid;
      gap: 7px;
      margin: 13px 0;
    }

    .field label,
    .section-title,
    .chip-title {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-sm);
      outline: none;
      background: #ffffff;
      color: var(--text);
      padding: 12px 13px;
    }

    .field input {
      min-height: 48px;
      line-height: 1.25;
    }

    .field input[type="date"] {
      height: 50px;
      min-height: 50px;
      padding-block: 0;
      line-height: normal;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
    }

    .field input[type="date"]::-webkit-date-and-time-value {
      min-height: 1.25em;
      line-height: 1.25;
      text-align: center;
    }

    .field input[type="date"]::-webkit-calendar-picker-indicator {
      margin: 0;
    }

    .field textarea {
      min-height: 112px;
      resize: vertical;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.35;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .type-option,
    .category-chip {
      cursor: pointer;
      border: 1px solid var(--hairline-strong);
      background: #ffffff;
    }

    .type-option {
      min-height: 52px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-weight: 700;
    }

    .type-option.selected-income {
      background: rgba(18, 138, 92, .16);
      border-color: rgba(18, 138, 92, .50);
      color: var(--income);
    }

    .type-option.selected-expense {
      background: rgba(195, 63, 46, .14);
      border-color: rgba(195, 63, 46, .46);
      color: var(--expense);
    }

    .confirm-lead,
    .confirm-message,
    .tiny-status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
      margin: 0;
    }

    .tiny-status.status-success {
      color: var(--accent-dark);
      font-weight: 700;
    }

    .section-title {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid var(--hairline);
      color: var(--text);
      font-size: 15px;
      letter-spacing: .01em;
    }

    .category-chip-area {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .category-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .category-chip {
      border: 1px solid rgba(198, 161, 91, .45);
      border-radius: 999px;
      background: var(--gold-pale);
      color: var(--gold-dark);
      padding: 7px 12px;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }

    .confirm-lead {
      color: var(--text);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .confirm-box {
      border: 1px solid var(--hairline);
      border-radius: 11px;
      background: rgba(255, 255, 255, .48);
      padding: 13px;
      margin-top: 6px;
    }

    .actions {
      display: flex;
      gap: var(--actions-gap);
      margin-top: 16px;
    }

    /* 見た目は .danger-button、幅は保存・キャンセル1つ分 */
    .modal-delete-button {
      display: block;
      width: calc((100% - var(--actions-gap)) / 2);
      margin: 12px auto 0;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      flex: 1;
      min-height: 48px;
      border: 1px solid var(--hairline-strong);
      border-radius: 11px;
      padding: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button { background: var(--accent-gradient); border-color: rgba(10, 31, 54, .50); color: #fff; box-shadow: 0 14px 26px -14px rgba(10, 22, 39, .50); }
    .secondary-button { background: rgba(255, 255, 255, .68); color: var(--text); }
    .danger-button { background: rgba(195, 63, 46, .10); border-color: rgba(195, 63, 46, .24); color: var(--expense); }


    .quote-button {
      display: block;
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(195, 63, 46, .30);
      border-radius: 11px;
      background: linear-gradient(155deg, #d2503c, var(--expense));
      color: #fff;
      padding: 11px 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 26px -16px rgba(195, 63, 46, .50);
    }

    .fixed-quote-list {
      display: grid;
      gap: 10px;
    }

    .fixed-quote-group {
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      overflow: hidden;
    }

    .fixed-quote-group-head,
    .fixed-quote-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }

    .fixed-quote-group-head {
      padding: 9px 10px 8px;
      background: var(--gold-pale);
      border-bottom: 1px solid rgba(16, 29, 47, .10);
    }

    .fixed-quote-title,
    .fixed-quote-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fixed-quote-title {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .fixed-quote-title > strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    .fixed-quote-title small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .fixed-quote-category-amount,
    .fixed-quote-detail-amount {
      min-width: 68px;
      text-align: right;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .fixed-quote-category-amount {
      color: var(--accent-dark);
      font-size: 13.5px;
    }

    .fixed-quote-item {
      padding: 9px 10px;
      border-top: 1px solid var(--hairline);
    }

    .fixed-quote-group-head + .fixed-quote-item {
      border-top: 0;
    }

    .fixed-quote-name {
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .quote-category-button,
    .quote-detail-button {
      border: 1px solid var(--hairline-strong);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      color: var(--accent-dark);
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .backup-output {
      display: none;
    }

    .backup-output.open {
      display: block;
    }

    .backup-output textarea {
      min-height: 78px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--footer-h) + 96px);
      z-index: 120;
      transform: translateX(-50%) translateY(12px);
      max-width: min(520px, calc(100vw - 32px));
      border-radius: 999px;
      background: rgba(10, 22, 39, .88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: #fff;
      padding: 11px 16px;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 600;
      white-space: pre-line;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.open {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 540px) {
      :root {
        --inner-width: calc(100vw - 32px);
        --floating-gap: 8px;
        --list-row-font-size: 14px;
        --list-row-height: 42px;
        --list-row-left: 10px;
        --list-row-right: 8px;
        --data-btn-pad-x: 11px;
      }

      .screen-title {
        font-size: clamp(25px, 7.2vw, 30px);
      }

      .data-button {
        padding: 8px var(--data-btn-pad-x);
      }

      .editable-balance {
        min-height: 70px;
        padding: 14px 18px;
      }

      .editable-balance::after {
        font-size: 11.5px;
      }

      .transaction-info {
        gap: 2px;
      }

      .transaction-info::after {
        left: calc(var(--tx-row-left) + var(--date-col-w) + 1px);
        top: 10px;
        bottom: 10px;
      }

      .fixed-cost-subtotal,
      .fixed-cost-amount {
        min-width: 76px;
      }

      .fixed-quote-category-amount,
      .fixed-quote-detail-amount {
        min-width: 62px;
      }

      .summary-line span:last-child {
        font-size: 16px;
      }

      .summary-line.total span:last-child {
        font-size: 27px;
      }

      .floating-actions {
        left: calc(12px + env(safe-area-inset-left));
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(var(--footer-h) + 20px);
      }

      .floating-nav,
      .floating-clear,
      .floating-add {
        min-height: 50px;
        padding: 0 14px;
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      :root {
        --inner-width: calc(100vw - 28px);
        --floating-gap: 7px;
        --data-btn-pad-x: 9px;
      }

      .screen-title {
        font-size: 24px;
      }

      .data-button {
        padding: 7px var(--data-btn-pad-x);
        font-size: 12.5px;
      }

      .floating-actions {
        left: calc(10px + env(safe-area-inset-left));
        right: calc(10px + env(safe-area-inset-right));
      }

      .floating-nav,
      .floating-clear,
      .floating-add {
        padding: 0 11px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="top-balance">
    <div class="top-inner">
      <div class="header-topbar">
        <h1 id="screenTitle" class="screen-title">収支管理簿</h1>
        <div class="header-actions">
          <button id="dataButton" class="data-button" type="button">データバックアップ・復元</button>
          <div class="bulk-select">
            <span id="bulkCount" class="bulk-count" aria-live="polite"></span>
            <button id="selectAllButton" class="data-button" type="button" aria-pressed="false">すべて選択</button>
          </div>
          <span class="app-version">v2.7</span>
        </div>
      </div>
      <div id="balanceArea" class="balance-area">
        <div class="label">現在の預金残高</div>
        <button id="currentBalance" class="editable-balance" type="button" aria-label="現在の預金残高を編集">¥0</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="screenSlider" class="screen-slider">
      <section id="mainScreen" class="screen" aria-label="収支管理簿">
        <div id="transactionList" class="list"></div>
        <p id="transactionHint" class="list-hint">行をタップで編集</p>
      </section>
      <section id="fixedCostScreen" class="screen screen-hidden" aria-label="固定費管理簿">
        <div id="fixedCostContent"></div>
      </section>
    </div>
  </main>

  <div class="floating-actions" aria-label="画面操作">
    <button id="screenSwitchButton" class="floating-nav" type="button">固定費管理簿へ</button>
    <button id="bulkDoneButton" class="floating-add bulk-done" type="button" hidden>完了</button>
    <div class="floating-spacer" aria-hidden="true"></div>
    <button id="bulkEditButton" class="floating-add" type="button">一括編集</button>
    <button id="addButton" class="floating-add" type="button">予定追加</button>
    <button id="bulkExcludeButton" class="floating-nav bulk-action" type="button" hidden>除外</button>
    <button id="bulkIncludeButton" class="floating-nav bulk-action" type="button" hidden>含める</button>
    <button id="bulkDeleteButton" class="floating-clear bulk-action" type="button" hidden>削除</button>
  </div>

  <footer class="bottom-summary" aria-label="収支集計">
    <div class="bottom-inner summary-grid">
      <div class="summary-line">
        <span>収入合計</span>
        <span id="incomeTotal">¥0</span>
      </div>
      <div class="summary-line">
        <span>支出合計</span>
        <span id="expenseTotal">¥0</span>
      </div>
      <div class="summary-line total">
        <span>収支（預金残高含む）</span>
        <span id="finalBalance">¥0</span>
      </div>
    </div>
  </footer>

  <footer class="fixed-bottom-summary" aria-label="固定費総合計">
    <div class="bottom-inner summary-grid">
      <div class="summary-line total">
        <span>固定費総合計</span>
        <span id="fixedCostTotalFooter">¥0</span>
      </div>
    </div>
  </footer>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title">入力</h2>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "simple-household-book-main-v1";
    const EXPORT_PREFIX_COMPRESSED = "S2.";
    const EXPORT_PREFIX_PLAIN = "S2P.";
    const YEN_FORMATTER = new Intl.NumberFormat("ja-JP", {
      style: "currency",
      currency: "JPY",
      maximumFractionDigits: 0
    });
    const INTEGER_FORMATTER = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 0 });
    const JA_COLLATOR = new Intl.Collator("ja");
    const FOCUSABLE_SELECTOR = "button:not([disabled]),input:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex='-1'])";
    const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
    const CHECK_IN = [{ opacity: 0, transform: "translateX(-8px)" }, { opacity: 1, transform: "none" }];
    const FADE_IN = [{ opacity: 0 }, { opacity: 1 }];
    const ZOOM_IN = [{ opacity: 0, transform: "scale(.94)" }, { opacity: 1, transform: "none" }];
    const TAPPABLE_ROW = ".transaction-row, .fixed-cost-item, .fixed-cost-group-head";
    const FLIP_PARTS = ".transaction-info, .amount, .fixed-cost-head-title, .fixed-cost-subtotal, .fixed-cost-name, .fixed-cost-amount";

    function sampleDate(monthOffset, day) {
      const now = new Date();
      return toDateInputValue(new Date(now.getFullYear(), now.getMonth() + monthOffset, day));
    }

    const defaultFixedCosts = [
      { id: newId(), category: "口座振替", name: "家賃", amount: 70000 },
      { id: newId(), category: "口座振替", name: "光熱費", amount: 12000 },
      { id: newId(), category: "口座振替", name: "保険", amount: 5000 },
      { id: newId(), category: "カード払い", name: "食費・日用品", amount: 40000 },
      { id: newId(), category: "カード払い", name: "通信費", amount: 8000 },
      { id: newId(), category: "カード払い", name: "積立", amount: 20000 },
      { id: newId(), category: "カード払い", name: "サブスク", amount: 2000 }
    ];

    const defaultData = {
      currentBalance: 250000,
      fixedCategories: ["口座振替", "カード払い"],
      fixedCosts: clone(defaultFixedCosts),
      transactions: [
        { id: newId(), date: sampleDate(0, 25), type: "income", name: "給与", amount: 300000 },
        { id: newId(), date: sampleDate(0, 27), type: "expense", name: "口座振替", amount: -87000 },
        { id: newId(), date: sampleDate(1, 10), type: "expense", name: "カード払い", amount: -70000 },
        { id: newId(), date: sampleDate(1, 15), type: "expense", name: "旅行費", amount: -30000 }
      ]
    };

    let data = loadData();

    const state = {
      screen: "main",
      bulkEdit: false,
      selectedIds: new Set(),
      selectedCategories: new Set(),
      previousFocus: null,
      modalOnClose: null,
      modalBack: null,
      modalClosing: null,
      backdropPointerDown: false,
      toastTimer: null,
      screenVisibilityTimer: null,
      layoutSyncQueued: false,
      headerH: "",
      footerH: ""
    };

    const elements = {
      topBalance: document.querySelector(".top-balance"),
      bottomSummary: document.querySelector(".bottom-summary"),
      fixedBottomSummary: document.querySelector(".fixed-bottom-summary"),
      screenTitle: document.getElementById("screenTitle"),
      dataButton: document.getElementById("dataButton"),
      currentBalance: document.getElementById("currentBalance"),
      mainScreen: document.getElementById("mainScreen"),
      fixedCostScreen: document.getElementById("fixedCostScreen"),
      transactionList: document.getElementById("transactionList"),
      transactionHint: document.getElementById("transactionHint"),
      fixedCostContent: document.getElementById("fixedCostContent"),
      screenSwitchButton: document.getElementById("screenSwitchButton"),
      bulkEditButton: document.getElementById("bulkEditButton"),
      bulkDoneButton: document.getElementById("bulkDoneButton"),
      bulkCount: document.getElementById("bulkCount"),
      selectAllButton: document.getElementById("selectAllButton"),
      bulkSelect: document.querySelector(".bulk-select"),
      bulkExcludeButton: document.getElementById("bulkExcludeButton"),
      bulkIncludeButton: document.getElementById("bulkIncludeButton"),
      bulkDeleteButton: document.getElementById("bulkDeleteButton"),
      addButton: document.getElementById("addButton"),
      incomeTotal: document.getElementById("incomeTotal"),
      expenseTotal: document.getElementById("expenseTotal"),
      finalBalance: document.getElementById("finalBalance"),
      fixedCostTotalFooter: document.getElementById("fixedCostTotalFooter"),
      modalBackdrop: document.getElementById("modalBackdrop"),
      modal: document.querySelector(".modal"),
      modalHead: document.querySelector(".modal-head"),
      modalTitle: document.getElementById("modalTitle"),
      modalBody: document.getElementById("modalBody"),
      toast: document.getElementById("toast")
    };

    elements.addButton.addEventListener("click", () => {
      if (state.screen === "fixed") openFixedCostModal({ mode: "add" });
      else openTransactionModal({ mode: "add" });
    });
    elements.bulkEditButton.addEventListener("click", enterBulkEdit);
    elements.bulkDoneButton.addEventListener("click", () => setBulkEdit(false));
    elements.selectAllButton.addEventListener("click", toggleSelectAll);
    elements.bulkExcludeButton.addEventListener("click", () => setSelectedExcluded(true));
    elements.bulkIncludeButton.addEventListener("click", () => setSelectedExcluded(false));
    elements.bulkDeleteButton.addEventListener("click", deleteSelected);
    [elements.transactionList, elements.fixedCostContent].forEach(container => {
      container.addEventListener("click", handleRowClick);
      container.addEventListener("keydown", handleRowKeydown);
    });
    elements.currentBalance.addEventListener("click", openBalanceEditor);
    elements.screenSwitchButton.addEventListener("click", toggleScreen);
    elements.dataButton.addEventListener("click", () => openDataModal());
    // モーダル内から始めたドラッグを背景上で離しても閉じない
    elements.modalBackdrop.addEventListener("pointerdown", event => {
      state.backdropPointerDown = event.target === elements.modalBackdrop;
    });
    elements.modalBackdrop.addEventListener("click", event => {
      if (event.target === elements.modalBackdrop && state.backdropPointerDown) dismissModal();
      state.backdropPointerDown = false;
    });
    document.addEventListener("keydown", handleDocumentKeydown);
    window.addEventListener("resize", scheduleLayoutSync);

    setupLayoutObservers();
    render();
    applyScreenVisibility();
    syncLayoutInsets();

    function newId() {
      if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
      return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function clone(value) {
      if (typeof structuredClone === "function") return structuredClone(value);
      return JSON.parse(JSON.stringify(value));
    }

    function setupLayoutObservers() {
      if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(scheduleLayoutSync);
        [elements.topBalance, elements.bottomSummary, elements.fixedBottomSummary]
          .filter(Boolean)
          .forEach(element => {
            // padding(セーフエリア)の変化を拾うため border-box を監視する
            try {
              observer.observe(element, { box: "border-box" });
            } catch (error) {
              observer.observe(element);
            }
          });
      }

      // iOSはセーフエリア・ツールバー・フォントの確定が初回描画より遅れるため再計測する
      window.addEventListener("orientationchange", scheduleLayoutSync);
      window.addEventListener("pageshow", scheduleLayoutSync);
      window.addEventListener("load", scheduleLayoutSync);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleLayoutSync);
        window.visualViewport.addEventListener("scroll", scheduleLayoutSync);
      }
      if (document.fonts?.ready) document.fonts.ready.then(scheduleLayoutSync).catch(() => {});
    }

    function scheduleLayoutSync() {
      if (state.layoutSyncQueued) return;
      state.layoutSyncQueued = true;
      requestAnimationFrame(() => {
        state.layoutSyncQueued = false;
        syncLayoutInsets();
      });
    }

    function syncLayoutInsets() {
      const footer = state.screen === "fixed" ? elements.fixedBottomSummary : elements.bottomSummary;
      const headerH = `${Math.ceil(elements.topBalance.getBoundingClientRect().height)}px`;
      const footerH = `${Math.ceil(footer.getBoundingClientRect().height)}px`;
      const rootStyle = document.documentElement.style;

      // 値が変わった時のみ更新（ルート変数の更新は全体の再計算を招く）
      if (headerH !== state.headerH) {
        rootStyle.setProperty("--header-h", headerH);
        state.headerH = headerH;
      }
      if (footerH !== state.footerH) {
        rootStyle.setProperty("--footer-h", footerH);
        state.footerH = footerH;
      }
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? normalizeData(JSON.parse(raw)) : clone(defaultData);
      } catch {
        return clone(defaultData);
      }
    }

    function normalizeData(input) {
      if (!input || !Number.isFinite(input.currentBalance) || !Array.isArray(input.transactions)) {
        throw new Error("invalid data");
      }

      const fixedCostSource = Array.isArray(input.fixedCosts) ? input.fixedCosts : defaultFixedCosts;
      const fixedCosts = fixedCostSource.map(item => ({
        id: item.id || newId(),
        category: String(item.category || "").trim(),
        name: String(item.name || "").trim(),
        amount: Math.trunc(Number(item.amount))
      })).filter(item => item.category && item.name && Number.isFinite(item.amount) && item.amount > 0);

      const categorySource = Array.isArray(input.fixedCategories)
        ? input.fixedCategories
        : fixedCostSource.map(item => item.category);

      const fixedCategories = uniqueStrings([
        ...categorySource,
        ...fixedCosts.map(item => item.category)
      ]);

      const transactions = input.transactions.map(item => ({
        id: item.id || newId(),
        date: String(item.date),
        type: item.type,
        name: String(item.name || "").trim(),
        amount: Math.trunc(Number(item.amount)),
        excluded: item.excluded === true
      })).filter(item =>
        /^\d{4}-\d{2}-\d{2}$/.test(item.date) &&
        (item.type === "income" || item.type === "expense") &&
        item.name &&
        Number.isFinite(item.amount)
      );

      return {
        currentBalance: Math.trunc(input.currentBalance),
        fixedCategories,
        fixedCosts,
        transactions
      };
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch {
        showToast("データを保存できませんでした。\nブラウザの設定をご確認ください。");
      }
    }

    function render() {
      renderTransactions();
      renderFixedCosts();
    }

    function renderTransactions() {
      renderSummary();
      renderTransactionList();
    }

    function renderFixedCosts() {
      elements.fixedCostTotalFooter.textContent = formatYen(fixedCostTotal());
      renderFixedCostScreen();
    }

    function renderSummary() {
      const totals = transactionTotals(data.transactions);
      elements.currentBalance.textContent = formatYen(data.currentBalance);
      setMoneyText(elements.incomeTotal, totals.income);
      setMoneyText(elements.expenseTotal, totals.expense);
      setMoneyText(elements.finalBalance, data.currentBalance + totals.income + totals.expense);
    }

    function renderTransactionList() {
      const transactions = sortedTransactions(data.transactions);
      elements.transactionHint.hidden = !transactions.length;
      if (!transactions.length) {
        elements.transactionList.className = "empty";
        elements.transactionList.innerHTML = "予定がありません。<br>右下の「予定追加」から登録してください。";
        return;
      }

      const bulk = state.bulkEdit;
      elements.transactionList.className = "list";
      elements.transactionList.innerHTML = transactions.map(item => {
        const amountClass = item.amount >= 0 ? "income" : "expense";
        const selected = bulk && state.selectedIds.has(item.id);
        const rowClass = `row transaction-row${item.excluded ? " excluded" : ""}${selected ? " selected" : ""}`;
        const label = `${formatMonthDay(item.date)} ${item.name} ${formatSignedYen(item.amount)}${item.excluded ? "（計算から除外）" : ""}`;
        return `
          <div class="${rowClass}" data-id="${escapeHtml(item.id)}" ${rowAttributes(label, selected)}>
            <span class="bulk-check" aria-hidden="true"></span>
            <div class="transaction-info">
              <div class="date">${formatMonthDay(item.date)}</div>
              <div class="name">${escapeHtml(item.name)}</div>
              <div class="amount ${amountClass}">${formatSignedYen(item.amount)}</div>
            </div>
          </div>
        `;
      }).join("");
      updateBulkSelectionUi();
    }

    function rowAttributes(label, selected) {
      return `role="button" tabindex="0" aria-label="${escapeHtml(label)}"${state.bulkEdit ? ` aria-pressed="${selected}"` : ""}`;
    }

    function renderFixedCostScreen() {
      const bulk = state.bulkEdit;
      const groups = fixedCostGroups({ sortCategoriesBySubtotal: true });
      const listHtml = groups.map(group => {
        const categorySelected = bulk && state.selectedCategories.has(group.category);
        return `
        <div class="fixed-cost-group">
          <div class="fixed-cost-group-head${categorySelected ? " selected" : ""}" data-category="${escapeHtml(group.category)}" ${rowAttributes(`カテゴリ ${group.category} ${group.items.length}件 ${formatYen(group.subtotal)}`, categorySelected)}>
            <span class="bulk-check" aria-hidden="true"></span>
            <div class="fixed-cost-head-title"><span>${escapeHtml(group.category)}</span><small> (${group.items.length}件)</small></div>
            <strong class="fixed-cost-subtotal">${formatYen(group.subtotal)}</strong>
          </div>
          ${group.items.length ? group.items.map(item => {
            const selected = bulk && state.selectedIds.has(item.id);
            return `
            <div class="fixed-cost-item${selected ? " selected" : ""}" data-id="${escapeHtml(item.id)}" ${rowAttributes(`${item.name} ${formatYen(item.amount)}`, selected)}>
              <span class="bulk-check" aria-hidden="true"></span>
              <div class="fixed-cost-name">${escapeHtml(item.name)}</div>
              <div class="fixed-cost-amount">${formatYen(item.amount)}</div>
            </div>
          `;
          }).join("") : '<div class="empty-mini">このカテゴリの固定費明細はありません。</div>'}
        </div>
      `;
      }).join("");

      elements.fixedCostContent.innerHTML = `
        <div class="fixed-cost-list">
          ${listHtml || '<div class="empty-mini">固定費カテゴリがありません。<br>右下の「固定費追加」から登録してください。</div>'}
        </div>
        ${listHtml ? '<p class="list-hint">行をタップで編集</p>' : ""}
      `;
      updateBulkSelectionUi();
    }

    function handleRowClick(event) {
      const row = event.target.closest(TAPPABLE_ROW);
      if (!row) return;
      if (state.bulkEdit) {
        toggleSelection(row);
        return;
      }

      if (row.matches(".fixed-cost-group-head")) {
        openCategoryModal(row.dataset.category);
        return;
      }
      const isTransaction = row.matches(".transaction-row");
      const item = (isTransaction ? data.transactions : data.fixedCosts).find(entry => entry.id === row.dataset.id);
      if (!item) return;
      if (isTransaction) openTransactionModal({ mode: "edit", item });
      else openFixedCostModal({ mode: "edit", item });
    }

    function handleRowKeydown(event) {
      if ((event.key !== "Enter" && event.key !== " ") || !event.target.matches(TAPPABLE_ROW)) return;
      event.preventDefault();
      event.target.click();
    }

    function toggleScreen() {
      state.screen = state.screen === "main" ? "fixed" : "main";
      applyScreenVisibility();
    }

    function applyScreenVisibility() {
      const fixed = state.screen === "fixed";
      const activeScreen = fixed ? elements.fixedCostScreen : elements.mainScreen;
      const inactiveScreen = fixed ? elements.mainScreen : elements.fixedCostScreen;

      clearTimeout(state.screenVisibilityTimer);
      activeScreen.classList.remove("screen-hidden");
      activeScreen.inert = false;
      inactiveScreen.inert = true;

      document.body.classList.toggle("fixed-screen", fixed);
      elements.screenTitle.textContent = fixed ? "固定費管理簿" : "収支管理簿";
      elements.screenSwitchButton.textContent = fixed ? "収支管理簿へ" : "固定費管理簿へ";
      elements.addButton.textContent = fixed ? "固定費追加" : "予定追加";

      state.screenVisibilityTimer = setTimeout(() => {
        inactiveScreen.classList.add("screen-hidden");
      }, 360);

      scheduleLayoutSync();
    }

    function sortedTransactions(transactions) {
      return [...transactions].sort((a, b) => {
        if (a.date === b.date) return JA_COLLATOR.compare(a.name, b.name);
        return a.date < b.date ? -1 : 1;
      });
    }

    function transactionTotals(transactions) {
      return transactions.reduce((totals, item) => {
        if (item.excluded) return totals;
        if (item.amount > 0) totals.income += item.amount;
        if (item.amount < 0) totals.expense += item.amount;
        return totals;
      }, { income: 0, expense: 0 });
    }

    function sortedFixedCategories() {
      return [...data.fixedCategories].sort(JA_COLLATOR.compare);
    }

    function sortedFixedCosts(fixedCosts) {
      return [...fixedCosts].sort((a, b) => {
        if (a.category === b.category) return JA_COLLATOR.compare(a.name, b.name);
        return JA_COLLATOR.compare(a.category, b.category);
      });
    }

    function fixedCostGroups({ includeEmpty = true, sortCategoriesBySubtotal = false } = {}) {
      const groups = new Map();

      data.fixedCategories.forEach(category => {
        groups.set(category, { category, subtotal: 0, items: [] });
      });

      data.fixedCosts.forEach(item => {
        if (!groups.has(item.category)) {
          groups.set(item.category, { category: item.category, subtotal: 0, items: [] });
        }
        const group = groups.get(item.category);
        group.subtotal += item.amount;
        group.items.push(item);
      });

      const values = [...groups.values()];
      values.forEach(group => group.items.sort((a, b) => {
        if (a.amount !== b.amount) return b.amount - a.amount;
        return JA_COLLATOR.compare(a.name, b.name);
      }));

      // 安定ソートのため同額は登録順を保つ
      if (sortCategoriesBySubtotal) values.sort((a, b) => b.subtotal - a.subtotal);

      return includeEmpty ? values : values.filter(group => group.items.length > 0 && group.subtotal > 0);
    }

    function fixedCostTotal() {
      return data.fixedCosts.reduce((sum, item) => sum + item.amount, 0);
    }

    function setMoneyText(element, value) {
      element.textContent = formatSignedYen(value);
      element.classList.remove("money-positive", "money-negative", "money-zero");
      if (value > 0) element.classList.add("money-positive");
      else if (value < 0) element.classList.add("money-negative");
      else element.classList.add("money-zero");
    }

    function openTransactionModal({ mode, item = null, draft = null }) {
      const isEdit = mode === "edit";
      const values = draft || {
        date: isEdit ? item.date : todayAsInputValue(),
        type: isEdit ? item.type : "income",
        name: isEdit ? item.name : "",
        amount: isEdit ? Math.abs(item.amount) : ""
      };

      openModal("", transactionFormHtml(values, isEdit), isEdit ? "予定の変更" : "予定の追加");
      setupTransactionForm({ mode, item, values });
      setupMoneyInput("transactionAmountInput");
      setupEnterNavigation(["transactionDateInput", "transactionNameInput", "transactionAmountInput"]);
      setupSelectAllOnFocus(["transactionNameInput"]);

      document.getElementById("cancelButton").addEventListener("click", closeModal);
      document.getElementById("saveButton").addEventListener("click", () => {
        const formValues = readTransactionForm();
        if (!formValues) return;

        if (isEdit) Object.assign(item, formValues);
        else data.transactions.push({ id: newId(), ...formValues });

        saveData();
        closeModal();
        renderTransactions();
      });

      if (!isEdit) return;
      document.getElementById("modalDeleteButton").addEventListener("click", async () => {
        const draft = readTransactionDraft();
        const ok = await showConfirm({
          title: "予定削除",
          message: `予定「${item.name}」を削除します。\nこの操作は元に戻せません。`,
          danger: true
        });
        if (!ok) {
          openTransactionModal({ mode, item, draft });
          return;
        }

        data.transactions = data.transactions.filter(tx => tx.id !== item.id);
        saveData();
        renderTransactions();
      });
    }

    function transactionFormHtml(values, isEdit) {
      return `
        <div class="field">
          <label for="transactionDateInput">月日</label>
          <input id="transactionDateInput" type="date" value="${escapeHtml(values.date)}" enterkeyhint="next">
        </div>
        <div class="field">
          <label>収入/支出</label>
          <div class="type-toggle" role="group" aria-label="収入または支出を選択">
            <button class="type-option" type="button" data-type-option="income">収入</button>
            <button class="type-option" type="button" data-type-option="expense">支出</button>
          </div>
        </div>
        <div id="fixedQuickArea" hidden>
          <button id="openFixedQuoteButton" class="quote-button" type="button">固定費管理簿から引用</button>
        </div>
        <div class="field">
          <label for="transactionNameInput">名称</label>
          <input id="transactionNameInput" type="text" value="${escapeHtml(values.name)}" enterkeyhint="next">
        </div>
        <div class="field">
          <label for="transactionAmountInput">金額</label>
          <input id="transactionAmountInput" type="text" inputmode="numeric" value="${escapeHtml(formatYenInput(values.amount))}" placeholder="¥ -" enterkeyhint="done">
        </div>
        ${modalActionsHtml(isEdit)}
      `;
    }

    function setupTransactionForm(context) {
      setTransactionType(context.values.type);

      elements.modalBody.querySelectorAll("[data-type-option]").forEach(button => {
        button.addEventListener("click", () => setTransactionType(button.dataset.typeOption));
      });

      const quoteButton = document.getElementById("openFixedQuoteButton");
      if (quoteButton) {
        quoteButton.addEventListener("click", () => {
          openFixedQuoteModal({
            mode: context.mode,
            item: context.item,
            draft: readTransactionDraft()
          });
        });
      }
    }

    function readTransactionDraft() {
      const selectedType = elements.modalBody.querySelector("[data-type-option][aria-pressed='true']")?.dataset.typeOption || "income";
      return {
        date: document.getElementById("transactionDateInput")?.value || todayAsInputValue(),
        type: selectedType,
        name: document.getElementById("transactionNameInput")?.value.trim() || "",
        amount: parseYenInput(document.getElementById("transactionAmountInput")?.value) || ""
      };
    }

    function openFixedQuoteModal(context) {
      openModal("固定費管理簿から引用", fixedQuoteModalHtml());

      elements.modalBody.querySelectorAll("[data-quote-category-index]").forEach(button => {
        button.addEventListener("click", () => {
          const groups = fixedCostGroups({ includeEmpty: false, sortCategoriesBySubtotal: true });
          const group = groups[Number(button.dataset.quoteCategoryIndex)];
          if (!group) return;
          applyFixedQuote(context, group.category, group.subtotal);
        });
      });

      elements.modalBody.querySelectorAll("[data-quote-detail-id]").forEach(button => {
        button.addEventListener("click", () => {
          const item = data.fixedCosts.find(cost => cost.id === button.dataset.quoteDetailId);
          if (!item) return;
          applyFixedQuote(context, item.name, item.amount);
        });
      });

      state.modalBack = () => openTransactionModal(context);
      document.getElementById("quoteBackButton").addEventListener("click", state.modalBack);
      document.getElementById("quoteCancelButton")?.addEventListener("click", closeModal);
    }

    function fixedQuoteModalHtml() {
      const groups = fixedCostGroups({ includeEmpty: false, sortCategoriesBySubtotal: true });
      if (!groups.length) {
        return `
          <div class="empty-mini">固定費明細がありません。<br>固定費管理簿で登録してください。</div>
          <div class="actions">
            <button class="secondary-button" type="button" id="quoteBackButton">戻る</button>
            <button class="secondary-button" type="button" id="quoteCancelButton">キャンセル</button>
          </div>
        `;
      }

      return `
        <div class="fixed-quote-list">
          ${groups.map((group, index) => `
            <div class="fixed-quote-group">
              <div class="fixed-quote-group-head">
                <div class="fixed-quote-title">
                  <strong>${escapeHtml(group.category)}</strong><small> (${group.items.length}件)</small>
                </div>
                <div class="fixed-quote-category-amount">${formatYen(group.subtotal)}</div>
                <button class="quote-category-button" type="button" data-quote-category-index="${index}">カテゴリで引用</button>
              </div>
              ${group.items.map(item => `
                <div class="fixed-quote-item">
                  <div class="fixed-quote-name">${escapeHtml(item.name)}</div>
                  <div class="fixed-quote-detail-amount">${formatYen(item.amount)}</div>
                  <button class="quote-detail-button" type="button" data-quote-detail-id="${escapeHtml(item.id)}">個別で引用</button>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
        <div class="actions">
          <button class="secondary-button" type="button" id="quoteBackButton">戻る</button>
          <button class="secondary-button" type="button" id="quoteCancelButton">キャンセル</button>
        </div>
      `;
    }

    function applyFixedQuote(context, name, amount) {
      openTransactionModal({
        ...context,
        draft: {
          ...context.draft,
          type: "expense",
          name,
          amount
        }
      });
    }

    function setTransactionType(type) {
      const normalized = type === "expense" ? "expense" : "income";
      elements.modalBody.querySelectorAll("[data-type-option]").forEach(button => {
        const selected = button.dataset.typeOption === normalized;
        button.classList.toggle(`selected-${button.dataset.typeOption}`, selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      const fixedArea = document.getElementById("fixedQuickArea");
      if (fixedArea) fixedArea.hidden = normalized !== "expense";
    }

    function readTransactionForm() {
      const type = elements.modalBody.querySelector("[data-type-option][aria-pressed='true']")?.dataset.typeOption || "income";
      const date = document.getElementById("transactionDateInput").value;
      const name = document.getElementById("transactionNameInput").value.trim();
      const amount = readPositiveAmount("transactionAmountInput");

      if (!date) {
        showToast("月日を入力してください。");
        return null;
      }
      if (!name) {
        showToast("名称を入力してください。");
        return null;
      }
      if (amount === null) return null;

      return {
        date,
        type,
        name,
        amount: type === "income" ? amount : -amount
      };
    }

    function enterBulkEdit() {
      const fixed = state.screen === "fixed";
      if (fixed ? !data.fixedCategories.length : !data.transactions.length) {
        showToast(fixed ? "編集する固定費がありません。" : "編集する予定がありません。");
        return;
      }
      setBulkEdit(true);
    }

    // 固定費画面では「除外」「含める」を出さない
    function setBulkEdit(on) {
      const fixed = state.screen === "fixed";
      const before = measureRowPositions();
      const normalControls = [elements.screenSwitchButton, elements.bulkEditButton, elements.addButton];
      const bulkControls = fixed
        ? [elements.bulkDoneButton, elements.bulkDeleteButton]
        : [elements.bulkDoneButton, elements.bulkExcludeButton, elements.bulkIncludeButton, elements.bulkDeleteButton];

      state.bulkEdit = on;
      state.selectedIds.clear();
      state.selectedCategories.clear();
      document.body.classList.toggle("bulk-edit", on);
      normalControls.forEach(button => { button.hidden = on; });
      [elements.bulkDoneButton, elements.bulkExcludeButton, elements.bulkIncludeButton, elements.bulkDeleteButton]
        .forEach(button => { button.hidden = !on || !bulkControls.includes(button); });
      elements.currentBalance.disabled = on;

      if (fixed) renderFixedCostScreen();
      else renderTransactionList();

      const motion = motionOptions();
      animateRows(before, on, motion);
      const appearing = on ? [elements.bulkSelect, ...bulkControls] : [elements.dataButton, ...normalControls];
      // 無効状態のボタンは薄いまま現れるよう、到達点を現在の不透明度にする
      const opacities = appearing.map(element => getComputedStyle(element).opacity);
      appearing.forEach((element, index) => element.animate([{ opacity: 0 }, { opacity: opacities[index] }], motion));
    }

    // 時間とカーブは CSS 変数（--motion-duration / --ease-out）から取得する
    function motionOptions(durationVar = "--motion-duration", easingVar = "--ease-out") {
      const rootStyle = getComputedStyle(document.documentElement);
      const duration = rootStyle.getPropertyValue(durationVar).trim();
      return {
        duration: duration.endsWith("ms") ? parseFloat(duration) : parseFloat(duration) * 1000,
        easing: rootStyle.getPropertyValue(easingVar).trim()
      };
    }

    function activeRows() {
      const container = state.screen === "fixed" ? elements.fixedCostContent : elements.transactionList;
      return [...container.querySelectorAll(TAPPABLE_ROW)];
    }

    function rowKey(row) {
      return row.dataset.category === undefined ? row.dataset.id : `category:${row.dataset.category}`;
    }

    function measureRowPositions() {
      const positions = new Map();
      activeRows().forEach(row => {
        positions.set(rowKey(row), [...row.querySelectorAll(FLIP_PARTS)].map(part => part.getBoundingClientRect().left));
      });
      return positions;
    }

    // 行の中身を切替前の位置から移動させる（計測をまとめてから書き込む）
    function animateRows(before, entering, motion) {
      const moves = [];
      activeRows().forEach(row => {
        const prev = before.get(rowKey(row));
        if (!prev) return;
        const parts = [...row.querySelectorAll(FLIP_PARTS)];
        moves.push({ row, parts, dx: parts.map((part, index) => prev[index] - part.getBoundingClientRect().left) });
      });

      moves.forEach(({ row, parts, dx }) => {
        parts.forEach((part, index) => {
          // 入れ子の要素は親の移動分を差し引く
          const parentIndex = parts.indexOf(part.parentElement.closest(FLIP_PARTS));
          slideFrom(part, parentIndex < 0 ? dx[index] : dx[index] - dx[parentIndex], motion);
        });
        if (entering) row.querySelector(".bulk-check").animate(CHECK_IN, motion);
      });
    }

    function slideFrom(element, dx, motion) {
      if (dx) element.animate([{ transform: `translateX(${dx}px)` }, { transform: "none" }], motion);
    }

    // カテゴリ行の選択は配下の明細すべての選択と連動する
    function toggleSelection(row) {
      if (row.matches(".fixed-cost-group-head")) {
        const category = row.dataset.category;
        const select = !state.selectedCategories.has(category);
        if (select) state.selectedCategories.add(category);
        else state.selectedCategories.delete(category);
        data.fixedCosts.forEach(cost => {
          if (cost.category !== category) return;
          if (select) state.selectedIds.add(cost.id);
          else state.selectedIds.delete(cost.id);
        });
      } else {
        const id = row.dataset.id;
        if (state.selectedIds.has(id)) state.selectedIds.delete(id);
        else state.selectedIds.add(id);
        if (row.matches(".fixed-cost-item")) syncCategorySelection(data.fixedCosts.find(cost => cost.id === id).category);
      }
      syncSelectionUi();
    }

    // 空のカテゴリはカテゴリ行のタップでのみ選択する
    function syncCategorySelection(category) {
      const items = data.fixedCosts.filter(cost => cost.category === category);
      if (items.length && items.every(cost => state.selectedIds.has(cost.id))) state.selectedCategories.add(category);
      else state.selectedCategories.delete(category);
    }

    function isRowSelected(row) {
      return row.dataset.category === undefined
        ? state.selectedIds.has(row.dataset.id)
        : state.selectedCategories.has(row.dataset.category);
    }

    function syncSelectionUi() {
      activeRows().forEach(row => {
        const selected = isRowSelected(row);
        row.classList.toggle("selected", selected);
        row.setAttribute("aria-pressed", String(selected));
      });
      updateBulkSelectionUi();
    }

    function isAllSelected() {
      if (state.screen === "fixed") {
        return state.selectedCategories.size === data.fixedCategories.length
          && state.selectedIds.size === data.fixedCosts.length;
      }
      return state.selectedIds.size > 0 && state.selectedIds.size === data.transactions.length;
    }

    function toggleSelectAll() {
      const select = !isAllSelected();
      if (state.screen === "fixed") {
        state.selectedIds = new Set(select ? data.fixedCosts.map(cost => cost.id) : []);
        state.selectedCategories = new Set(select ? data.fixedCategories : []);
      } else {
        state.selectedIds = new Set(select ? data.transactions.map(tx => tx.id) : []);
      }
      syncSelectionUi();
    }

    function updateBulkSelectionUi() {
      if (!state.bulkEdit) return;
      const count = state.selectedIds.size + state.selectedCategories.size;
      const allSelected = count > 0 && isAllSelected();
      elements.bulkCount.textContent = `${count}件選択中`;
      elements.selectAllButton.textContent = allSelected ? "選択解除" : "すべて選択";
      elements.selectAllButton.setAttribute("aria-pressed", String(allSelected));
      [elements.bulkExcludeButton, elements.bulkIncludeButton, elements.bulkDeleteButton]
        .forEach(button => { button.disabled = count === 0; });
    }

    function setSelectedExcluded(excluded) {
      data.transactions.forEach(item => {
        if (state.selectedIds.has(item.id)) item.excluded = excluded;
      });
      saveData();
      renderTransactions();
    }

    function deleteSelected() {
      if (state.screen === "fixed") deleteSelectedFixedCosts();
      else deleteSelectedTransactions();
    }

    async function encodeExportString(sourceData) {
      const packed = packData(sourceData);
      const json = JSON.stringify(packed);

      if ("CompressionStream" in window) {
        try {
          return EXPORT_PREFIX_COMPRESSED + bytesToBase64Url(await compressText(json));
        } catch {}
      }

      return EXPORT_PREFIX_PLAIN + bytesToBase64Url(new TextEncoder().encode(json));
    }

    async function decodeExportString(input) {
      // 転記時に混入した改行・空白を除去する
      const text = input.replace(/\s+/g, "");

      if (text.startsWith(EXPORT_PREFIX_COMPRESSED)) {
        const bytes = base64UrlToBytes(text.slice(EXPORT_PREFIX_COMPRESSED.length));
        const json = await decompressText(bytes);
        return unpackData(JSON.parse(json));
      }

      if (text.startsWith(EXPORT_PREFIX_PLAIN)) {
        const bytes = base64UrlToBytes(text.slice(EXPORT_PREFIX_PLAIN.length));
        const json = new TextDecoder().decode(bytes);
        return unpackData(JSON.parse(json));
      }

      throw new Error("unknown format");
    }

    function packData(sourceData) {
      const dictionary = [];
      const dictionaryMap = new Map();
      const textIndex = value => {
        const text = String(value || "");
        if (dictionaryMap.has(text)) return dictionaryMap.get(text);
        const index = dictionary.length;
        dictionary.push(text);
        dictionaryMap.set(text, index);
        return index;
      };

      const transactions = sortedTransactions(sourceData.transactions).map(item => {
        const row = [Number(item.date.replaceAll("-", "")), textIndex(item.name), item.amount];
        if (item.excluded) row.push(1);
        return row;
      });

      const fixedCosts = sortedFixedCosts(sourceData.fixedCosts).map(item => [
        textIndex(item.category),
        textIndex(item.name),
        item.amount
      ]);

      const fixedCategories = uniqueStrings(sourceData.fixedCategories || [])
        .map(category => textIndex(category));

      return [sourceData.currentBalance, dictionary, transactions, fixedCosts, fixedCategories];
    }

    function unpackData(packed) {
      if (!Array.isArray(packed) || packed.length !== 5 || !Array.isArray(packed[1]) || !Array.isArray(packed[2])) {
        throw new Error("invalid packed data");
      }

      const dictionary = packed[1].map(value => String(value || ""));
      const readText = index => {
        const text = dictionary[Number(index)];
        if (typeof text !== "string") throw new Error("invalid dictionary reference");
        return text;
      };

      const transactions = packed[2].map(item => {
        if (!Array.isArray(item) || item.length < 3) throw new Error("invalid transaction");
        const dateText = String(item[0]).padStart(8, "0");
        const amount = Math.trunc(Number(item[2]));
        return {
          id: newId(),
          date: `${dateText.slice(0, 4)}-${dateText.slice(4, 6)}-${dateText.slice(6, 8)}`,
          type: amount >= 0 ? "income" : "expense",
          name: readText(item[1]),
          amount,
          excluded: item[3] === 1
        };
      });

      const fixedCosts = packed[3].map(item => {
        if (!Array.isArray(item) || item.length < 3) throw new Error("invalid fixed cost");
        return {
          id: newId(),
          category: readText(item[0]),
          name: readText(item[1]),
          amount: Math.trunc(Number(item[2]))
        };
      });

      const fixedCategories = packed[4].map(index => readText(index));

      return normalizeData({
        currentBalance: Math.trunc(Number(packed[0])),
        fixedCategories,
        fixedCosts,
        transactions
      });
    }

    async function compressText(text) {
      const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("deflate"));
      const buffer = await new Response(stream).arrayBuffer();
      return new Uint8Array(buffer);
    }

    async function decompressText(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
      const buffer = await new Response(stream).arrayBuffer();
      return new TextDecoder().decode(buffer);
    }

    function bytesToBase64Url(bytes) {
      const chunks = [];
      const chunkSize = 0x8000;
      for (let index = 0; index < bytes.length; index += chunkSize) {
        chunks.push(String.fromCharCode(...bytes.subarray(index, index + chunkSize)));
      }
      return btoa(chunks.join("")).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
    }

    function base64UrlToBytes(text) {
      const base64 = text.replaceAll("-", "+").replaceAll("_", "/")
        + "=".repeat((4 - text.length % 4) % 4);
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function copyText(text) {
      if (!navigator.clipboard || !window.isSecureContext) return false;
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        return false;
      }
    }

    // 閉じるアニメーション中は閉じた扱い
    function isModalOpen() {
      return elements.modalBackdrop.classList.contains("open") && !state.modalClosing;
    }

    function openModal(title, bodyHtml, ariaLabel = "") {
      const wasOpen = isModalOpen();
      // 閉じる途中で開き直した場合（確認のキャンセルで前の画面へ戻る等）は画面内の切り替えとして扱う
      const wasVisible = wasOpen || Boolean(state.modalClosing);
      stopModalClosing();
      // モーダル内の画面遷移では最初の呼び出し元を保持する
      if (!wasOpen) {
        state.previousFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      }
      runModalOnClose();
      state.modalBack = null;
      elements.modalTitle.textContent = title || "";
      elements.modalHead.hidden = !title;

      // 見出しを出さないモーダルでも読み上げ用の名前を保つ
      if (title) {
        elements.modalBackdrop.setAttribute("aria-labelledby", "modalTitle");
        elements.modalBackdrop.removeAttribute("aria-label");
      } else {
        elements.modalBackdrop.removeAttribute("aria-labelledby");
        elements.modalBackdrop.setAttribute("aria-label", ariaLabel || "入力");
      }

      elements.modalBody.innerHTML = bodyHtml;
      elements.modalBackdrop.classList.add("open");
      requestAnimationFrame(() => {
        elements.modalBackdrop.focus({ preventScroll: true });
      });

      if (wasVisible) {
        const motion = motionOptions("--motion-duration-short");
        [elements.modalHead, elements.modalBody].forEach(element => element.animate(FADE_IN, motion));
      } else {
        const motion = motionOptions();
        elements.modalBackdrop.animate(FADE_IN, motion);
        elements.modal.animate(ZOOM_IN, motion);
      }
    }

    function closeModal({ restoreFocus = true } = {}) {
      if (!isModalOpen()) return;
      state.modalBack = null;
      runModalOnClose();
      if (restoreFocus && state.previousFocus && document.contains(state.previousFocus)) state.previousFocus.focus();
      state.previousFocus = null;

      // 閉じる間は背後の一覧を操作できるようにする
      const motion = { ...motionOptions("--motion-duration-short", "--ease-in"), fill: "forwards" };
      elements.modalBackdrop.style.pointerEvents = "none";
      state.modalClosing = [
        elements.modalBackdrop.animate([...FADE_IN].reverse(), motion),
        elements.modal.animate([...ZOOM_IN].reverse(), motion)
      ];
      Promise.all(state.modalClosing.map(animation => animation.finished)).then(finishModalClose, () => {});
    }

    function finishModalClose() {
      stopModalClosing();
      elements.modalBackdrop.classList.remove("open");
      elements.modalBody.innerHTML = "";
    }

    function stopModalClosing() {
      if (!state.modalClosing) return;
      state.modalClosing.forEach(animation => animation.cancel());
      state.modalClosing = null;
      elements.modalBackdrop.style.removeProperty("pointer-events");
    }

    // 外側タップ・Esc：重ねて開いた画面ならひとつ前へ戻り、それ以外は閉じる
    function dismissModal() {
      if (state.modalBack) state.modalBack();
      else closeModal();
    }

    function runModalOnClose() {
      const onClose = state.modalOnClose;
      state.modalOnClose = null;
      if (onClose) onClose();
    }

    function isImeComposing(event) {
      return event.isComposing || event.keyCode === 229;
    }

    function handleDocumentKeydown(event) {
      if (!isModalOpen() || isImeComposing(event)) return;
      if (event.key === "Escape") {
        event.preventDefault();
        dismissModal();
        return;
      }
      if (event.key === "Tab") trapModalFocus(event);
    }

    function trapModalFocus(event) {
      const focusable = [...elements.modalBackdrop.querySelectorAll(FOCUSABLE_SELECTOR)]
        .filter(element => element.offsetParent !== null || element === document.activeElement);
      if (!focusable.length) {
        event.preventDefault();
        elements.modalBackdrop.focus();
        return;
      }

      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      // 背景にフォーカスがある時もモーダル内に留める
      if (!focusable.includes(document.activeElement)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function showConfirm({ title, message, leadMessage = "", confirmText = "削除", cancelText = "キャンセル", danger = false }) {
      return new Promise(resolve => {
        const leadHtml = leadMessage
          ? `<p class="confirm-lead">${escapeHtml(leadMessage).replaceAll("\n", "<br>")}</p>`
          : "";

        openModal(title, `
          ${leadHtml}
